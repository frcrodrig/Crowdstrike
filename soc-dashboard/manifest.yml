app_id: 565384fb56334ad88460f951988d7a77
name: agentic-soc-oversight-dashboard
description: Real-time SOC operations videowall with 15 live widgets covering threat volume, false-positive rate, SOC capacity, dark-hours coverage, MITRE ATT and CK, agent health, and backlog trends. Data sourced from Falcon Alerts REST, Devices API, and NGSIEM LogScale.
logo: logo.png
vendor: ""
vendor_products: []
use_case: ""
manifest_version: "2023-05-09"
ignored:
    - .+/node_modules$
    - .+/node_modules/.+
    - .+/venv$
    - .+/venv/.+
    - ^\.versions/
    - ^\.playwright-mcp/
    - ^[^l].*\.png$
    - ^l[^o].*\.png$
    - ^lo[^g].*\.png$
    - ^log[^o].*\.png$
    - ^logo[^.].*\.png$
    - ^logo\.[^p].*\.png$
    - ^logo\.p[^n].*\.png$
    - ^logo\.pn[^g].*\.png$
    - ^logo\.png.+\.png$
    - ^.*\.log$
    - ^.*\.txt$
    - ^.*-diagnostic.*\.js$
    - ^test-.*\.js$
    - ^EXTRACTED_QUERIES\.md$
    - ^INTEGRATION_SUMMARY.*\.md$
    - ^SOC_EFFICACY_METRICS\.md$
    - ^soc-efficacy-queries\.js$
    - ^extracted-queries\.json$
    - ^fga-hosts-aggregate-response\.json$
    - ^ui/pages/dashboard/src/dist/.*\.map$
ui:
    homepage: pages.dashboard
    extensions: []
    pages:
        dashboard:
            id: 5a165cfab6b5408fa4d6469070c81868
            name: dashboard
            description: Main SOC operations dashboard
            path: ui/pages/dashboard/src/dist
            entrypoint: ui/pages/dashboard/src/dist/index.html
            content_security_policy:
                connect-src:
                    - assets.foundry.crowdstrike.com
                    - assets-public.falcon.us-2.crowdstrike.com
                style-src:
                    - unsafe-inline
                style-src-elem:
                    - unsafe-inline
                script-src:
                    - unsafe-inline
                    - unsafe-eval
                form-action: []
                img-src: []
                media-src: []
                object-src: []
            permissions: []
    dashboards: {}
    navigation:
        id: 9d6350466bc54de296ff4a568214e358
        links:
            - path: /
              name: SOC Dashboard
              permissions: []
              ref: pages.dashboard
