name: charlotte-credits-fetcher
description: Fetch Charlotte AI credits usage data for dashboard widget
provision_on_install: true

trigger:
    name: On demand
    type: On demand
    next:
        - fetch_dashboard_data

actions:
    fetch_dashboard_data:
        id: functions.charlotte-credits.FetchCredits
        properties: {}
        version_constraint: ~0
        next:
            - print_results

    print_results:
        id: aadbf530e35fc452a032f5f8acaaac2a
        properties:
            text_data: "${data['fetch_dashboard_data.output']}"
        version_constraint: ~1

output_fields: []
